# Closed vocabulary — adding a value here is a taxonomy decision (PR + review, SPEC §4).
# This file must stay within the YAML subset defined in SPEC §3.4.

registry_version: "2.0.0"

# Trust Ladder positions. The step number leads every type id and sorts the gallery.
steps:
  1: "recognition / stop the scroll with pain"
  2: "amplify the problem (breadth or cause)"
  3: "explain why it works (mechanism, spec, operation)"
  4: "physical proof the skeptic can inspect"
  5: "identification and social evidence"
  6: "the state after buying (relief)"
  # Step 7 is NOT a Trust Ladder rung. It is the identity family (ADR-065): the frame
  # argues the OBJECT rather than a beat in the persuasion arc. The coverage pass of
  # query/runbook.md Step 5b counts rungs 1-6 and must not count this one as a gap.
  7: "identity — what the object is, and what arrives"

# job = what the image sells. Reserved values exist in the grammar but have no active type yet.
jobs:
  pain: "make the viewer recognize their own problem"
  symptom: "widen the scope of the problem across symptoms"
  cause: "indict a measurable cause in daily life; not about the product"
  mechanism: "justify the product's shape via what happens inside the body/object"
  use: "reassure about operation; teach the steps"
  spec: "component-level superiority; no people, no symptoms"
  proof: "physical evidence the viewer judges for themselves"
  persona: "answer: is this for someone like me"
  social: "someone credible is recommending it to someone like me"
  relief: "sell the state after purchase"
  identity: "what the object IS: the pack, its format, its size. Argues nothing beyond recognition"
  trust: "reserved — certificates, guarantees, authority"

# device = the signature visual mechanism. Reserved devices are grammar slots awaiting exemplars.
devices:
  split: "two-panel comparison, hard divide"
  rail: "hero photo + vertical vignette band listing symptoms"
  ghostbody: "anonymous white mannequin with interior cutaway, 3D render"
  anatomy: "2D medical illustration, skeleton over translucent body"
  grid: "photographic multi-cell collage, no graphic overlays"
  hero: "one photographic scene + optional inset/product layers"
  scene: "single cinematic frame, no panels and no insets"
  sequence: "stacked panels ordered by action steps"
  lockedframe: "multi-panel, camera locked (or handheld-continuous), one variable changes"
  handoff: "two people: advocate points, listener looks; optional product inset"
  card: "verbatim review/quote card composited over a lifestyle base photo"
  snapshot: "raw single-frame customer-style phone photo; authenticity is the argument"
  demo: "reserved — close-up hand demonstration"
  xray: "see-through product internals: product translucent, internals solid"
  explode: "product separated into its real component groups along one axis, technical render"
  timeline: "reserved — states along a time axis"
  macro: "reserved — extreme close-up of material/texture"
  stilllife: "one named raw material alone in frame, presented so it is recognisable"
  lineup: "several units of one product standing together; exactly one thing differs across them"
  claimstack: "a subject to one side, a headline and short claim lines filling the other"
  inhand: "the product held up to the lens; the hand is the scale cue and nothing else is"
  pack: "the product as it arrives — closed, open, or with its own contents at its foot"
  callout: "a subject at the centre, labelled satellites around it; what joins them — a leader line, a dashed leader, or nothing — is a parameter"

# Cross-cutting presentation dimensions. A type declares which values it supports
# in its frontmatter `axes:` map. Definitions of the semantics live in rules/runbooks.
axes:
  register: [commercial, ugc]
  camera_lock: [strict, handheld]
  gaze: [candid, confront, reflect]
  context_mode: [natural-use, declared-test]
  inset_mode: [vsinset, recall, context, detail, none]
  # Whether a legislated layer is the finished picture or carries the motion brief
  # plate an editor works from. G12, ADR-019. Never creates a layer.
  inset_motion: [still, loop]

# A type declares what its picture NEEDS. What the pipeline can actually DO is
# declared once in query/runbook.md Step 3 — paste-and-run, no compositing.
#
# `multi-pass` is GONE (ADR-067, owner instruction 2026-09-03). ADR-021 stopped it
# reaching a prompt, ADR-039 retired the adapter rule that expanded it, ADR-041
# deprecated the value and set the countdown this line describes, and the count
# reached 0 on 2026-09-03 when `04-proof-lockedframe` took the invariants-block
# route. The value is removed rather than left deprecated because a legal value no
# route can select is the shape CLAUDE.md rule 6c exists to catch.
#
# The field keeps its name and its meaning: `generation_mode` reads like a claim
# about the PIPELINE and is a claim about what the PICTURE needs. With one legal
# value it now says the same thing every time, which is the honest state — every
# picture this library describes is reachable in one generation call, and a picture
# that is not does not get a type until a single-pass route for it exists.
generation_modes: [single-pass]

channels: [marketplace, landing-page, paid-social, advertorial]

statuses: [active, reserved, deprecated]

# Section roles a content.json may declare. Routing table: mapping/slot-rules.md.
section_roles: [hero, problem-agitation, cause, mechanism, proof, social-proof, personas, how-to-use, comparison, outcome, cta, author]

observation_verdicts: [match, variant-candidate, new-candidate, duplicate, reject]

# GIF types (ADR-023). One type = one message, and the id IS the argument.
# The first five deliberately reuse a `jobs` value: a loop argues the same thing a
# picture argues, so no second word for the same idea. `unboxing` is the exception —
# it enumerates rather than changes, fails the temporal test a page slot applies, and
# exists for the ad channel alone. Files: registry/gif-types/<id>.md.
gif_types: [use, mechanism, cause, proof, relief, unboxing]

# Which half of the motion floor a gif type serves (query/runbook.md Step 5d).
# `working` = the product in action; `result` = what it leaves behind. A page's
# floor prefers one of each. `none` = counts toward nothing; ad channel only.
gif_groups: [working, result, none]

# ------------------------------------------------------------------ toplist
# A THIRD namespace, for the single lede image of a top-N listicle (SPEC 3.7,
# ADR-069). Separate from image types for the reason gif types are separate: that
# page has ONE image slot, so more than half of SPEC 7 — the role shortlist, the
# cross-slot pass, the coverage pass over the Trust Ladder, one-type-once — has
# nothing to act on. Ids are ARGUMENTS, not `{step}-{job}-{device}`, and none of
# these is ever written into index.yaml. Files: registry/toplist-types/<id>.md.
toplist_types: [lede-pain, lede-inuse, lede-lineup, lede-testing, lede-winner, lede-collage, lede-authority]

# How many DISTINCT products stand in the frame. This is the namespace's one
# mechanical admission test and it is deliberately not a matter of judgement:
# `many` needs one reference photo per product, and ADR-021 allows one per prompt.
# Until that is decided, every `many` type is `status: reserved`.
toplist_frame_populations: [one, many, none]

# The reader's stage, carried on the product input. It keys the preference table in
# mapping/toplist-rules.md and NOTHING ELSE — the owner's instruction of 2026-09-09
# was not to lean on it, and SPEC 7.5 says awareness is read from copy rather than
# declared. Here there is no page copy, so it is declared and demoted: it orders a
# shortlist, it never admits or refuses a type.
toplist_awareness: [unaware, problem-aware, solution-aware, product-aware, most-aware]

# Informative: things that are runtime parameters and must NEVER become identity.
parameters: [ratio, panel_count, colorway, persona_cast, environment]
