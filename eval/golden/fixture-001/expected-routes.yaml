# Golden routing expectations — fixture-001 (Metal Shower Filter, landing-page)
# Produced by the first dry-run of query/runbook.md against registry v2.0.0
# (2026-08-10). Regression contract: re-run Steps 2-4 of the runbook after any
# trigger/index/slot-rules change; every assertion below must still hold, or the
# change is either a bug or an intended improvement that updates this file in the
# SAME commit (SPEC section 9).
#
# NOTE: reference_photos in content.json is a placeholder hash until the real
# product photo is hashed. This affects rendering only, never routing.

registry_version: "2.0.0"
template: "query/runbook.md Steps 2-4"

slots:
  hero-1:
    section_role: hero
    expected_option_A: {type: 06-relief-hero, axes: {register: commercial, inset_mode: vsinset}}
    legal_alternatives_must_include:
      - {type: 06-relief-hero, axes: {register: commercial, inset_mode: recall}}
    forbidden:
      - reason: "ugc register is paid-social/advertorial only (slot-rules); this page is landing-page"
        config: {type: 06-relief-hero, axes: {register: ugc}}
    gates_that_must_fire:
      - "G8: visible_output=water-jet -> backlight branch, water jets primary subject"
      - "operation=passive -> relaxed POSE branch"
      - "mounting=fixed-installed -> installed mode in every layer (G7-X)"
      - "colorways has 1 entry -> Zone B shows 1 unit only"

  problem-1:
    section_role: problem-agitation
    expected_option_A: {type: 02-symptom-rail, note: "vignette mode visible-symptom; multiple problems_solved -> breadth argument"}
    legal_alternatives_must_include:
      - {type: 01-pain-split, note: "legal because symptom_visibility=visible"}
      - {type: 01-pain-scene, variant: confront, note: "legal on landing-page per slot-rules"}
    composition_note_required: >
      01-pain-scene and 01-pain-split are never_with each other — both may appear
      as OPTIONS for this slot, but the page set may contain only one of them.

  cause-1:
    section_role: cause
    expected_option_A: {type: 02-cause-anatomy}
    only_legal_type: 02-cause-anatomy
    note: "options B/C must vary on execution (hair-strand vs limescale-in-pipe), not type"

  proof-1:
    section_role: proof
    expected_option_A: {type: 04-proof-lockedframe, variant: timelapse, axes: {camera_lock: handheld}}
    legal_alternatives_must_include:
      - {type: 04-proof-lockedframe, variant: capture, axes: {context_mode: declared-test}}
    forbidden:
      - reason: "VARIANT SELECTION RULE (verified on this very product): filter differences are not visible in a static frame -> object variants are empty"
        config: {type: 04-proof-lockedframe, variant: rivals}
      - reason: "same rule"
        config: {type: 04-proof-lockedframe, variant: verdict}
    gates_that_must_fire:
      - "camera_lock=handheld because timelapse panels are separated by time"
      - "pipeline note: strict variants would be multi-pass; handheld timelapse may run single-pass"

  howto-1:
    section_role: how-to-use
    expected_option_A: {type: 03-use-sequence}
    only_legal_type: 03-use-sequence
    note: "multi_step_usage=true keeps it; options vary on execution"

  outcome-1:
    section_role: outcome
    expected_option_A: {type: 06-relief-hero, axes: {register: commercial, inset_mode: context}}
    only_legal_type: 06-relief-hero
    composition_note_required: >
      06-relief-hero already serves hero-1 and it is the ONLY type in the
      landing-page outcome cell, so one-type-once cannot be satisfied here by
      taking a different type. It is satisfied by rung 4 of the Step 4 ladder
      instead — another execution of a type already on the page, differing on a
      named dimension: hero-1 runs inset_mode vsinset and this slot runs context,
      and varies_on has to say so.
    superseded_2026_08_19: >
      Until today this slot listed 06-relief-scene as a conditional alternative.
      That line was written on 2026-08-10, one day before mapping/slot-rules.md
      trimmed 06-relief-scene off the landing-page column on the type's own
      use_when, which names only "an advertorial or final frame of an ads
      creative". The fixture was never re-run because nothing read it; check_golden
      now does, and it caught this on its first run.

page_level:
  coverage_limit: >
    This fixture has no social-proof and no personas slot, so it cannot test any
    step-5 candidate. eval/golden/fixture-002 was built 2026-08-11 to cover
    social-proof; route both when a step-5 trigger changes.
  arc: "pain (s2) and cause (s3) precede all relief (s1 is promise-hero, s6 outcome) — acceptable; pain never reappears after s4"
  out_of_scope_roles: []
  resolved_gap: >
    (was known_gap until 2026-08-11) A 'mechanism' section for this product now
    routes to 03-mechanism-xray, promoted registry v2.0.0 with 5 exemplars +
    render-test pass + confusion test against this fixture (all 6 slot
    assertions above held, 0 unintended flips). body_contact=false still drops
    ghostbody; xray's avoid_when still gates trivial interiors and
    anti-tech-render categories. A mechanism slot added to this page would
    expect: {type: 03-mechanism-xray, note: "internals: mesh disc, granule bed,
    outlet channel; G8 water path active"}.
  confusion_test_2026_08_12: >
    03-spec-explode promoted to active v1.0. Re-ran Steps 2-4 against this
    fixture: all 6 slot assertions held, 0 unintended flips. It is channel-legal
    here (landing-page) and shares the mechanism cell, but the documented
    mechanism expectation above stays 03-mechanism-xray on the type's own gate
    rather than on wording — that slot needs the water path shown ACTIVE, and
    explode's NEGATIVE bans an exploded view combined with a translucent intact
    shell, so it cannot serve a WHY slot at all. A granule bed is also near the
    "trivial interiors" case explode's avoid_when excludes. howto-1 is job=use
    and untouched.
