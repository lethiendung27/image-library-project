<text x="168" y="374" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A close shot of the textured underside of the</text>
<text x="168" y="432" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">cushion pressed against smooth leather, filling</text>
<text x="168" y="490" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the frame. The car brakes hard, the seat leather</text>
<text x="168" y="548" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">flexes and the whole cabin jolts, and the grip</text>
<text x="168" y="606" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">pattern does not travel a millimetre across it.</text>
<text x="168" y="669" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="168" y="721" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A close shot of the same underside on the same</text>
<text x="168" y="779" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">leather with a hand shoving the cushion hard from</text>
<text x="168" y="837" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">behind, nobody in the car. It gives a finger's width</text>
<text x="168" y="895" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">and settles back, while an ordinary flat pad</text>
<text x="168" y="953" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">beside it walks forward and stays there.</text>
