<text x="94" y="210" fill="#ffffff" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">104-07-relief-feature3.mp4</text>
<text x="94" y="241" fill="#ffffff" font-size="24" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">4s · 16:9 · seamless loop</text>
<line x1="94" y1="249" x2="1106" y2="249" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="94" y="286" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a man standing up off a metal bleacher bench at the end of a match. He comes to his full</text>
<text x="94" y="319" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">height in one movement without pushing off the rail or the bench, turns, and walks down the steps</text>
<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">without once reaching back for his lower back.</text>
<text x="94" y="388" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="418" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same man getting out of his car at the end of a long drive. He swings his legs out,</text>
<text x="94" y="451" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">stands straight up in one go without grabbing the door frame, and walks off with the cushion still on</text>
<text x="94" y="484" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the seat behind him.</text>
<text x="94" y="516" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/relief/ — no files filed yet; the folder card carries the law</text>
</svg>
