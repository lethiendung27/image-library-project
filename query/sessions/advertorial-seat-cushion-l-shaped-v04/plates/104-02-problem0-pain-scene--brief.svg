<text x="94" y="286" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a driver sitting on a hard donut pad on the car seat, or on the bare seat itself. When the car</text>
<text x="94" y="319" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">brakes the pad rolls forward under him and his pelvis drops back into the gap behind it, and sitting</text>
<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">like that nine hours a day is what locks the back.</text>
<text x="94" y="388" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="418" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same seat with a hand pushing an old donut pad forward from behind, no driver and no</text>
<text x="94" y="451" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">moving car. The pad rolls to the front lip and the gap opens behind it, the same gap a pelvis hinges</text>
<text x="94" y="484" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">back into on every brake.</text>
<text x="94" y="516" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/cause/ — no files filed yet; the folder card carries the law</text>
