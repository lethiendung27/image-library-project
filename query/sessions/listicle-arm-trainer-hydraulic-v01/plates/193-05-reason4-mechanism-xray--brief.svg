<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#31363d"/>
<rect x="66" y="66" width="1068" height="1068" fill="none" stroke="#f2f4f7" stroke-width="2"/>
<text x="168" y="239" fill="#ffffff" font-size="60" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">listicle-mechanism-arm-trainer-hydraulic-v01.mp4</text>
<text x="168" y="294" fill="#ffffff" font-size="43" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">2.5s · 1:1 · seamless loop</text>
<line x1="168" y1="307" x2="1032" y2="307" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="168" y="374" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A see-through view of the trainer's cylinder fills</text>
<text x="168" y="432" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the frame with the piston partway along it. A hand</text>
<text x="168" y="490" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">turns the dial collar a short way and the port</text>
<text x="168" y="548" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">through the piston narrows, then the fluid crossing</text>
<text x="168" y="606" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">it slows and thickens while the piston keeps</text>
<text x="168" y="664" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">moving at the same speed.</text>
<text x="168" y="727" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="168" y="779" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">The same see-through cylinder with no hand in</text>
<text x="168" y="837" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">frame, the dial collar turning on its own and the</text>
<text x="168" y="895" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">port closing, the fluid stream through it thinning to</text>
<text x="168" y="953" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">a hard bright thread as the opening shrinks.</text>
<text x="168" y="1010" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/mechanism/ — no files filed yet; the folder card</text>
<text x="168" y="1050" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">carries the law</text>
</svg>
