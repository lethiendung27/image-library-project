<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#31363d"/>
<rect x="66" y="66" width="1068" height="1068" fill="none" stroke="#f2f4f7" stroke-width="2"/>
<text x="168" y="234" fill="#ffffff" font-size="60" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">listicle-cause-arm-trainer-hydraulic-v01.mp4</text>
<text x="168" y="289" fill="#ffffff" font-size="43" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">2.5s · 1:1 · seamless loop</text>
<line x1="168" y1="302" x2="1032" y2="302" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="168" y="369" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">Two resistance bars lie side by side on a plain</text>
<text x="168" y="427" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">floor, each held compressed by a hand. Both</text>
<text x="168" y="485" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">hands let go at the same moment, the coil bar</text>
<text x="168" y="543" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">flies open and jumps clear of the floor, then the</text>
<text x="168" y="601" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">hydraulic bar opens slowly and evenly and stops</text>
<text x="168" y="659" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">where it was.</text>
<text x="168" y="722" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="168" y="774" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A close shot of one coil bar and one hydraulic bar</text>
<text x="168" y="832" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">clamped in the same rig, both compressed and</text>
<text x="168" y="890" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">released together, the coil snapping open past its</text>
<text x="168" y="948" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">rest position while the hydraulic arm travels out</text>
<text x="168" y="1006" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">at one steady speed.</text>
<text x="168" y="1063" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/cause/ — no files filed yet; the folder card carries</text>
<text x="168" y="1103" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the law</text>
