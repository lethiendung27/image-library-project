<text x="168" y="234" fill="#ffffff" font-size="60" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">listicle-use-arm-trainer-hydraulic-v01.mp4</text>
<text x="168" y="289" fill="#ffffff" font-size="43" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">4s · 1:1 · seamless loop</text>
<line x1="168" y1="302" x2="1032" y2="302" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="168" y="369" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A pair of hands holds the trainer across the knees</text>
<text x="168" y="427" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">on a living room rug. One hand turns the dial</text>
<text x="168" y="485" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">collar a short way, both hands take the grips and</text>
<text x="168" y="543" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">press the two arms together until they nearly</text>
<text x="168" y="601" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">meet, then the arms open back out and the hands</text>
<text x="168" y="659" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">come off it.</text>
<text x="168" y="722" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="168" y="774" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">The same hands and the same rug with the trainer</text>
<text x="168" y="832" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">flat on the floor instead of the knees, one hand</text>
<text x="168" y="890" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">turning the collar and both hands pressing the</text>
<text x="168" y="948" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">arms together from above, then letting them rise</text>
<text x="168" y="1006" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">back open.</text>
<text x="168" y="1063" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/use/ — no files filed yet; the folder card carries</text>
