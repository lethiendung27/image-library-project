<text x="168" y="234" fill="#ffffff" font-size="60" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">listicle-mechanism-massage-comb-spray-v01-reason5.webp</text>
<text x="168" y="289" fill="#ffffff" font-size="43" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">3s · 1:1 · seamless loop</text>
<line x1="168" y1="302" x2="1032" y2="302" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="168" y="369" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the comb's bristle bed close up on a</text>
<text x="168" y="427" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">bathroom shelf, three weeks of shed hair and dust</text>
<text x="168" y="485" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">packed down between the teeth. A thumb presses</text>
<text x="168" y="543" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the button on the handle, the teeth retract flush</text>
<text x="168" y="601" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">into the cushion, and the whole mat lifts clear in</text>
<text x="168" y="659" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">one piece.</text>
<text x="168" y="722" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="168" y="774" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same bristle bed held over an open</text>
<text x="168" y="832" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">bin. The teeth retract flush into the cushion, the</text>
<text x="168" y="890" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">packed mat of hair and dust comes away as one,</text>
<text x="168" y="948" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">and it drops into the bin leaving a clean cushion</text>
<text x="168" y="1006" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">behind.</text>
<text x="168" y="1063" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/mechanism/ — no files filed yet; the folder card</text>
<text x="168" y="1103" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">carries the law</text>
</svg>
