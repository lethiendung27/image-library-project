<text x="168" y="403" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the comb on a shelf. Water fills the port</text>
<text x="168" y="461" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">at the top of the handle, then it lifts to a section of</text>
