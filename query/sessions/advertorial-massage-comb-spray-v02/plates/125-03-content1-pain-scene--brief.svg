<text x="168" y="374" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a rigid brush being drawn down into a</text>
<text x="168" y="432" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">knot at the back of a child's head. The teeth</text>
<text x="168" y="490" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">catch, the hair around the knot pulls tight and lifts</text>
<text x="168" y="548" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">with the brush, and her shoulders come up as it</text>
<text x="168" y="606" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">holds.</text>
<text x="168" y="669" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="168" y="721" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same brush pulled slowly through a</text>
<text x="168" y="779" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">hank of fine hair held in one hand, no child in the</text>
<text x="168" y="837" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">frame. The teeth reach a knot, the strands bunch</text>
<text x="168" y="895" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">and tighten into it, and the whole hank travels</text>
<text x="168" y="953" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">with the brush.</text>
