<text x="94" y="286" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a driver sitting on an old flat cushion on the car seat, or on the bare seat itself. When the car</text>
<text x="94" y="319" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">brakes the cushion slides forward under him and a gap opens behind his lower back, and sitting in</text>
<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">that gap day after day is what starts the ache.</text>
<text x="94" y="388" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="418" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same driver's seat with a hand pushing an old flat cushion forward from behind, no</text>
<text x="94" y="451" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">driver and no moving car. The cushion walks to the front lip and the gap opens behind it, the same</text>
<text x="94" y="484" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gap a pelvis drops into on every brake.</text>
<text x="94" y="516" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/cause/ — no files filed yet; the folder card carries the law</text>
</svg>
