<text x="94" y="210" fill="#ffffff" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">advertorial-proof-seat-cushion-l-shaped-v03.webp</text>
<text x="94" y="241" fill="#ffffff" font-size="24" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">3s · 16:9 · seamless loop</text>
<line x1="94" y1="249" x2="1106" y2="249" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="94" y="286" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a driver braking in stop-and-go traffic with the cushion under him on the driver's seat. The</text>
<text x="94" y="319" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">car lurches, his weight throws forward and settles back, and the cushion stays exactly where he put</text>
<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">it, nothing creeping to the front lip.</text>
<text x="94" y="388" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="418" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same seat from the open door with a hand shoving the cushion hard from behind, nobody</text>
<text x="94" y="451" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">in the car. It moves a finger's width and settles back, while an ordinary flat pad beside it walks to the</text>
<text x="94" y="484" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">front lip and stays there.</text>
<text x="94" y="516" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/proof/ — no files filed yet; the folder card carries the law</text>
</svg>
