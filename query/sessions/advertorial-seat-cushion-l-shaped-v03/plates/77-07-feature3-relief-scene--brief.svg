<text x="94" y="286" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a man getting out of his car at the end of a long drive. He swings his legs out, stands</text>
<text x="94" y="319" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">straight up in one movement without grabbing the door frame, and walks off without once reaching</text>
<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">back for his lower back.</text>
<text x="94" y="388" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="418" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same man at his desk at the end of a shift with the cushion on the chair behind him. He</text>
<text x="94" y="451" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">pushes back, stands up in one go without pressing his hands on the desk, and picks his bag off the</text>
<text x="94" y="484" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">floor on the way out.</text>
