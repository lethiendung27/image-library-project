<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#31363d"/>
<rect x="37" y="37" width="1126" height="601" fill="none" stroke="#f2f4f7" stroke-width="2"/>
<text x="94" y="226" fill="#ffffff" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">77-06-proof-feature2.mp4</text>
<text x="94" y="257" fill="#ffffff" font-size="24" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">3s · 16:9 · seamless loop</text>
<line x1="94" y1="265" x2="1106" y2="265" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="94" y="302" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">One continuous frame and no panels: the same car driver's seat through the same open door, but</text>
<text x="94" y="335" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">close in so the reference cushion fills the frame. The weight that has been sitting on it lifts away out</text>
<text x="94" y="368" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">of shot, and the slow-rebound contour rises unhurried back to its full depth at the seat corner before</text>
<text x="94" y="401" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the weight returns and presses it down again. Nobody in frame. The same overcast daylight through</text>
<text x="94" y="434" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the open door and the same neutral grade as the still, which drops its three panels for this one frame —</text>
<text x="94" y="467" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">that restaging is the whole move.</text>
<text x="94" y="499" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/proof/ — no files filed yet; the folder card carries the law</text>
</svg>
