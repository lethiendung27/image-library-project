<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of someone sitting on the cushion on the driver's seat, one unbroken frame that never cuts.</text>
