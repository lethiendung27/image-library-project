<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#31363d"/>
<rect x="66" y="66" width="1068" height="1068" fill="none" stroke="#f2f4f7" stroke-width="2"/>
<text x="168" y="234" fill="#ffffff" font-size="60" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">97-03-proof-reason1.mp4</text>
<text x="168" y="289" fill="#ffffff" font-size="43" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">3s · 1:1 · seamless loop</text>
<line x1="168" y1="302" x2="1032" y2="302" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="168" y="369" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of one length of hair lying on a bathroom</text>
<text x="168" y="427" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">shelf, standing up in a halo of separated strands</text>
<text x="168" y="485" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">after a plastic brush. The reference comb passes</text>
<text x="168" y="543" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">down it once and the halo drops, strand by strand,</text>
<text x="168" y="601" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">until the whole length is lying settled and flat</text>
<text x="168" y="659" fill="#ffffff" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">along the shelf.</text>
<text x="168" y="722" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="168" y="774" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a woman's own hair at the side of her</text>
<text x="168" y="832" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">head, fine strands standing out from the crown.</text>
<text x="168" y="890" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">The comb passes down through them once and</text>
<text x="168" y="948" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">they fall back against the rest of the hair and stay</text>
<text x="168" y="1006" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">there, with no hand smoothing them down</text>
<text x="168" y="1064" fill="#aeb6c0" font-size="37" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">afterwards.</text>
<text x="168" y="1121" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/proof/ — no files filed yet; the folder card carries</text>
<text x="168" y="1161" fill="#aeb6c0" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the law</text>
</svg>
