<text x="94" y="210" fill="#ffffff" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">advertorial-proof-seat-cushion-l-shaped-v05.webp</text>
<text x="94" y="241" fill="#ffffff" font-size="24" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">3s · 16:9 · seamless loop</text>
<line x1="94" y1="249" x2="1106" y2="249" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="94" y="286" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A close shot of the cushion alone on a car seat at the end of a shift. A hand presses the seat section</text>
<text x="94" y="319" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">down flat and lets go, and the contour rises back to its full depth at the seat corner without a dent left</text>
<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">in it.</text>
<text x="94" y="388" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="418" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A close shot of the cushion on an office chair with a full backpack set down on the seat section. The</text>
<text x="94" y="451" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">pack is lifted away and the contour springs back to its full depth while a thin foam pad beside it stays</text>
<text x="94" y="484" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">dished.</text>
<text x="94" y="516" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/proof/ — no files filed yet; the folder card carries the law</text>
</svg>
