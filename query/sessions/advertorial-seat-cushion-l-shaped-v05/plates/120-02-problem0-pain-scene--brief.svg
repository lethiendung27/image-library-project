<text x="94" y="302" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of a driver sitting on a thin foam wedge on his car seat. The car brakes at a junction, the</text>
<text x="94" y="335" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">wedge slides forward under him and his pelvis rolls back into the open gap behind it, which is where</text>
<text x="94" y="368" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the ache starts.</text>
<text x="94" y="404" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="434" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A shot of the same seat with a hand pushing a foam wedge forward from behind, nobody in the car.</text>
<text x="94" y="467" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">The wedge travels to the front lip and the gap opens behind it, the same gap a pelvis drops into.</text>
<text x="94" y="499" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/cause/ — no files filed yet; the folder card carries the law</text>
