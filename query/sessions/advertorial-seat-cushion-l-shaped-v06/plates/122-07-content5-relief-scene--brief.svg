<text x="94" y="210" fill="#ffffff" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">advertorial-relief-seat-cushion-l-shaped-v06.mp4</text>
<text x="94" y="241" fill="#ffffff" font-size="24" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">3s · 16:9 · seamless loop</text>
<line x1="94" y1="249" x2="1106" y2="249" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="94" y="286" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A man gets out of a car in a hotel car park at the end of a long drive and walks away from it toward</text>
<text x="94" y="319" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the entrance. He stands straight up out of the seat in one movement, does not stop to steady himself</text>
<text x="94" y="352" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">and does not put a hand to his back, and his stride is even from the first step.</text>
<text x="94" y="388" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="418" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">The same claim with no car and no actor: a wide shot of the hotel entrance path where a suitcase is</text>
<text x="94" y="451" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">wheeled steadily out of frame at walking pace, the wheels never pausing, and the open car door and</text>
<text x="94" y="484" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">the product on the seat sit at the edge of the frame throughout.</text>
<text x="94" y="516" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/relief/ — the folder card carries the law</text>
</svg>
