<rect x="37" y="37" width="1126" height="601" fill="none" stroke="#f2f4f7" stroke-width="2"/>
<text x="94" y="193" fill="#ffffff" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">advertorial-cause-seat-cushion-l-shaped-v06.mp4</text>
<text x="94" y="224" fill="#ffffff" font-size="24" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">3s · 16:9 · seamless loop</text>
<line x1="94" y1="232" x2="1106" y2="232" stroke="#aeb6c0" stroke-width="1" opacity="0.45"/>
<text x="94" y="269" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">A side-on view of a man lowering himself into a van seat that slopes backwards. As his weight</text>
<text x="94" y="302" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">settles his hips slide down below his knees, his pelvis rolls backwards into the gap where the seat</text>
<text x="94" y="335" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">base meets the backrest, and his lower back peels away from the seat leaving an open space behind</text>
<text x="94" y="368" fill="#ffffff" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">it.</text>
<text x="94" y="404" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.4">IF THAT CANNOT BE SHOT</text>
<text x="94" y="434" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">The same movement with no person: a hand presses down on the seat base where a body would sit,</text>
<text x="94" y="467" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">and the foam compresses backwards into the gap at the seat corner while a flat pad laid on it creeps</text>
<text x="94" y="500" fill="#aeb6c0" font-size="21" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">forward off the back of the base.</text>
<text x="94" y="532" fill="#aeb6c0" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.4">gifs-library/cause/ — the folder card carries the law</text>
</svg>
